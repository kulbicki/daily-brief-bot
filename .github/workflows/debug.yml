name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show environment
        run: env

      - name: Test Telegram Secret
        run: |
          echo "TELEGRAM_TOKEN=$TELEGRAM_TOKEN"
          echo "CHAT_ID=$CHAT_ID"
